[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runtimetruth"
version = "0.2.0"
description = "Runtime verification and drift detection for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Sidelobe Labs" }
]
dependencies = [
  "rfc8785==0.1.4",
]
keywords = ["ai-agents", "agent-security", "runtime", "drift-detection", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://sidelobe.dev/open-source/runtimetruth/"
Repository = "https://github.com/sidelobe-labs/runtimetruth"
Issues = "https://github.com/sidelobe-labs/runtimetruth/issues"
Documentation = "https://github.com/sidelobe-labs/runtimetruth/tree/main/docs"
Changelog = "https://github.com/sidelobe-labs/runtimetruth/blob/main/CHANGELOG.md"

[project.scripts]
runtimetruth = "runtimetruth.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runtimetruth"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
