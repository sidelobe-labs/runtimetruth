name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

  package:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install "build>=1.2"

      - name: Build distributions
        run: python -m build

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/runtimetruth-smoke
          /tmp/runtimetruth-smoke/bin/python -m pip install dist/*.whl
          /tmp/runtimetruth-smoke/bin/runtimetruth --version


  attestation-smoke:
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RuntimeTruth
        run: python -m pip install -e ".[dev]"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless sign and verify baseline
        shell: bash
        run: |
          set -euo pipefail

          baseline="tests/fixtures/snapshots/before.json"
          statement="${RUNNER_TEMP}/runtimetruth-baseline.intoto.json"
          bundle="${RUNNER_TEMP}/runtimetruth-baseline.sigstore.json"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"

          runtimetruth digest "${baseline}"

          runtimetruth attest "${baseline}" \
            --statement "${statement}" \
            --bundle "${bundle}"

          runtimetruth verify-attestation \
            "${baseline}" \
            "${baseline}" \
            --statement "${statement}" \
            --bundle "${bundle}" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
