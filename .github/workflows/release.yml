name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: runtimetruth-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check release version
        id: check
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "Release must run from ${DEFAULT_BRANCH}" >&2
            exit 1
          fi

          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(config["project"]["version"])
          PY
          )"
          tag="v${version}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Version ${tag} is already tagged; no publication needed."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Publishing ${tag}"
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build distributions
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests and install build tooling
        run: |
          python -m pip install -e ".[dev]" "twine>=6.1"
          ruff check .
          ruff format --check .
          pytest

      - name: Build distributions
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/runtimetruth-release-smoke
          /tmp/runtimetruth-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/runtimetruth-release-smoke/bin/runtimetruth --version

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runtimetruth
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub release
    needs: [version, publish-pypi]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "RuntimeTruth ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

          gh release create "${RELEASE_TAG}" dist/* \
            --title "RuntimeTruth ${RELEASE_TAG}" \
            --notes-file "docs/release-${RELEASE_TAG}.md" \
            --verify-tag
